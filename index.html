
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>SmartLight Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <header>
      <div>
        <h1>My Home</h1>
        <p>Smart home control</p>
      </div>
      <span class="home-icon">⌂</span>
    </header>

    <section class="device-card">
      <div class="device-heading">
        <h2>Living Room</h2>
        <span id="lightStatus" class="status off">
          OFF
        </span>
      </div>

      <div class="light-icon" id="lightIcon">💡</div>

      <h2>Smart Light</h2>
      <p id="message">Your light is switched OFF</p>

      <div class="controls">
        <button id="onBtn" class="on-btn">
          TURN ON
        </button>

        <button id="offBtn" class="off-btn">
          TURN OFF
        </button>
      </div>
    </section>

    <section class="connection-card">
      <h3>Device Connection</h3>

      <p id="connectionStatus">
        ESP32: Disconnected
      </p>

      <button id="connectBtn" class="connect-btn">
        Connect ESP32
      </button>
    </section>

    <footer>
      SMARTLIGHT CONTROL · VERSION 1.0
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
